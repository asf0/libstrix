# Builds ghcr.io/asf0/strix-vllm without a GPU: the ROCm/torch toolchain layer
# is built once per set of pins and reused, then the fork and libstrix compile
# on top. Smoke tests need the GPU and run on the Strix Halo box afterwards:
#   IMAGE=ghcr.io/asf0/strix-vllm:<tag> python bench/container/smoke.py
# Needs the repository secret GHCR_TOKEN (a PAT with write:packages), because
# the package is not linked to this repository.
#
# Releases: pushing a tag vX.Y.Z (semantic versioning, the version in
# pyproject.toml) builds the fork commit pinned in docker/strix-vllm.ref, tags
# the image X.Y.Z and :latest, and publishes a GitHub release whose notes are
# the top entry of CHANGELOG.md, with the recipes pinned to that image
# (libstrix-recipes-X.Y.Z.zip, docker/release-recipes.sh) attached. Tag the
# fork commit strix/vX.Y.Z in asf0/strix-vllm as well (the notes link it).
# A manual run builds a dev image (<libstrix>-<fork> commit tag) of any fork
# branch or commit, without a release.
name: image
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      fork_ref:
        description: strix-vllm branch or commit (empty = docker/strix-vllm.ref)
        default: ""
      latest:
        description: also move the :latest tag
        type: boolean
        default: false
permissions:
  contents: read
env:
  IMAGE: ghcr.io/asf0/strix-vllm
  TOOLCHAIN_IMAGE: ghcr.io/asf0/strix-vllm-toolchain
jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.key.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "tag=${{ hashFiles('docker/Dockerfile', 'docker/constraints.txt') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: asf0
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push the toolchain unless this tag exists
        run: |
          ref="$TOOLCHAIN_IMAGE:${{ steps.key.outputs.tag }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "$ref exists"; exit 0
          fi
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          docker buildx build -f docker/Dockerfile --target toolchain --push -t "$ref" .
  image:
    needs: toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the release of a version tag
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: asf0
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          ref="${{ inputs.fork_ref }}"
          [ -n "$ref" ] || ref=$(grep -v '^#' docker/strix-vllm.ref | head -1)
          fork=$(git ls-remote https://github.com/asf0/strix-vllm.git "$ref" | cut -c1-40 | head -1)
          fork=${fork:-$ref}
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            tags=(-t "$IMAGE:$tag" -t "$IMAGE:latest")
          else
            tag="$(git rev-parse --short=10 HEAD)-$(echo "$fork" | cut -c1-10)"
            tags=(-t "$IMAGE:$tag")
            [ "${{ inputs.latest }}" = true ] && tags+=(-t "$IMAGE:latest")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "fork=$fork" >> "$GITHUB_OUTPUT"
          docker buildx build -f docker/Dockerfile --push "${tags[@]}" \
            --build-arg TOOLCHAIN="$TOOLCHAIN_IMAGE:${{ needs.toolchain.outputs.tag }}" \
            --build-arg STRIX_VLLM_REF="$fork" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg MAX_JOBS=4 .
          echo "pushed $IMAGE:$tag"
      - name: Release with the CHANGELOG.md entry
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Image: \`$IMAGE:${{ steps.build.outputs.tag }}\` (also \`:latest\`)"
            echo
            echo "Built from libstrix $GITHUB_SHA and asf0/strix-vllm ${{ steps.build.outputs.fork }} (tag [strix/$GITHUB_REF_NAME](https://github.com/asf0/strix-vllm/tree/strix/$GITHUB_REF_NAME))."
            echo
            echo "Recipes pinned to this image: \`libstrix-recipes-${{ steps.build.outputs.tag }}.zip\` below."
            echo
            awk '/^## /{n++} n==1' CHANGELOG.md
          } > notes.md
          # The repository's releases are immutable once published: attach the
          # bundle to a draft, then publish it.
          docker/release-recipes.sh "${{ steps.build.outputs.tag }}" docker/recipes dist
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --notes-file notes.md \
            --title "$GITHUB_REF_NAME" dist/libstrix-recipes-*.zip
          gh release edit "$GITHUB_REF_NAME" --draft=false
