# Builds ghcr.io/asf0/strix-vllm without a GPU: the ROCm/torch toolchain layer
# is built once per set of pins and reused, then the fork and libstrix compile
# on top. Smoke tests need the GPU and run on the Strix Halo box afterwards:
#   IMAGE=ghcr.io/asf0/strix-vllm:<tag> python bench/container/smoke.py
# Needs the repository secret GHCR_TOKEN (a PAT with write:packages), because
# the package is not linked to this repository.
name: image
on:
  workflow_dispatch:
    inputs:
      fork_ref:
        description: strix-vllm branch or commit
        default: gfx1151
      latest:
        description: also move the :latest tag
        type: boolean
        default: false
permissions:
  contents: read
env:
  IMAGE: ghcr.io/asf0/strix-vllm
  TOOLCHAIN_IMAGE: ghcr.io/asf0/strix-vllm-toolchain
jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.key.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "tag=${{ hashFiles('docker/Dockerfile', 'docker/constraints.txt') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: asf0
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push the toolchain unless this tag exists
        run: |
          ref="$TOOLCHAIN_IMAGE:${{ steps.key.outputs.tag }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "$ref exists"; exit 0
          fi
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          docker buildx build -f docker/Dockerfile --target toolchain --push -t "$ref" .
  image:
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: asf0
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          fork=$(git ls-remote https://github.com/asf0/strix-vllm.git "${{ inputs.fork_ref }}" | cut -c1-40 | head -1)
          fork=${fork:-${{ inputs.fork_ref }}}
          tag="$(git rev-parse --short=10 HEAD)-$(echo "$fork" | cut -c1-10)"
          tags=(-t "$IMAGE:$tag")
          [ "${{ inputs.latest }}" = true ] && tags+=(-t "$IMAGE:latest")
          docker buildx build -f docker/Dockerfile --push "${tags[@]}" \
            --build-arg TOOLCHAIN="$TOOLCHAIN_IMAGE:${{ needs.toolchain.outputs.tag }}" \
            --build-arg STRIX_VLLM_REF="$fork" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg MAX_JOBS=4 .
          echo "pushed $IMAGE:$tag"
