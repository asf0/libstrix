# gemma-4-26B-A4B bf16.
#
#   docker compose -f gemma-4-26b-a4b.yaml up -d
#
# Overrides go in .env (see .env.example) or the shell.
services:
  gemma-4-26b-a4b:
    extends:
      file: common.yaml
      service: strix
    environment:
      MTP: ${MTP:-0}
      HF_REPO: google/gemma-4-26B-A4B-it
    command:
      - /models/gemma-4-26B-A4B-it
      - --mm-encoder-attn-backend=TRITON_ATTN
      - --attention-backend=TRITON_ATTN
      - --kv-cache-dtype=int8_per_token_head
      - --gpu-memory-utilization=${GPU_UTIL:-0.85}
      - --max-model-len=${MAX_MODEL_LEN:-262144}
      - --max-num-batched-tokens=${MAX_BATCHED_TOKENS:-8192}
      - --max-num-seqs=${MAX_NUM_SEQS:-8}
      # Tool calls and reasoning come back parsed, as chat clients expect.
      - --enable-auto-tool-choice
      - --tool-call-parser=gemma4
      - --reasoning-parser=gemma4
      # Sampling defaults (gemma-4 generation_config.json); a request's own values win.
      - '--override-generation-config={"temperature": 1.0, "top_p": 0.95, "top_k": 64}'
