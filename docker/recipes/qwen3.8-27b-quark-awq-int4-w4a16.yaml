# Qwen3.8-27B Quark AWQ INT4 W4A16.
#
#   docker compose -f qwen3.8-27b-quark-awq-int4-w4a16.yaml up -d
#
# Overrides go in .env (see .env.example) or the shell.
services:
  qwen3.8-27b-quark-awq-int4-w4a16:
    extends:
      file: common.yaml
      service: strix
    environment:
      MTP: ${MTP:-0}
      HF_REPO: amd/Qwen3.8-27B-Quark-AWQ-INT4-W4A16
    command:
      - /models/Qwen3.8-27B-Quark-AWQ-INT4-W4A16
      - --language-model-only
      - --attention-backend=TRITON_ATTN
      - --kv-cache-dtype=int8_per_token_head
      - --gpu-memory-utilization=${GPU_UTIL:-0.85}
      - --max-model-len=${MAX_MODEL_LEN:-131072}
      - --max-num-batched-tokens=${MAX_BATCHED_TOKENS:-8192}
      - --max-num-seqs=${MAX_NUM_SEQS:-16}
