# Sage-A1.5 FP8 (per-channel, Qwen3.6-35B-A3B architecture) + speculative
# decoding with the DFlash 2 draft (incoai/Qwen3.6-35B-A3B-DFlash2, mounted
# under /models). SPEC_TOKENS sets the draft tokens per step (the draft's
# block size minus one at most).
#
#   docker compose -f sage-a1.5-fp8.yaml up -d
#
# Overrides go in .env (see .env.example) or the shell.
services:
  sage-a1.5-fp8:
    extends:
      file: common.yaml
      service: strix
    environment:
      MTP: 0
      REPLAYSSM: ${REPLAYSSM:-1}
      HF_REPO: InternScience/Sage-A1.5-FP8
    command:
      - /models/Sage-A1.5-FP8
      - '--speculative-config={"method": "dflash", "model": "/models/Qwen3.6-35B-A3B-DFlash2", "num_speculative_tokens": ${SPEC_TOKENS:-7}}'
      - --mm-encoder-attn-backend=TRITON_ATTN
      - --attention-backend=TRITON_ATTN
      - --kv-cache-dtype=int8_per_token_head
      - --gpu-memory-utilization=${GPU_UTIL:-0.85}
      - --max-model-len=${MAX_MODEL_LEN:-131072}
      - --max-num-batched-tokens=${MAX_BATCHED_TOKENS:-8192}
      - --max-num-seqs=${MAX_NUM_SEQS:-16}
      # Tool calls and reasoning come back parsed, as chat clients expect.
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=qwen3
      # Sampling defaults (Sage-A1.5 model card); a request's own values win.
      - '--override-generation-config={"temperature": 1.0, "top_p": 0.95, "top_k": 20, "presence_penalty": 1.5}'
