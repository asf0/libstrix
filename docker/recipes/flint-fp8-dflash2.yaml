# Flint FP8 + DFlash 2 draft. Speculative decoding with the DFlash 2
# block-diffusion draft (incoai/Flint-DFlash2, mounted next to the target under
# /models). SPEC_TOKENS sets the draft tokens per step (at most 7: the draft's
# block size is 8). 3 is the measured best: a longer verify batch reads more
# of the 256 experts per step than the extra accepted tokens pay for.
#
#   docker compose -f flint-fp8-dflash2.yaml up -d
#
# Overrides go in .env (see .env.example) or the shell.
services:
  flint-fp8-dflash2:
    extends:
      file: common.yaml
      service: strix
    environment:
      MTP: 0
      HF_REPO: HawkBearPig/flint-FP8-BF16
    command:
      - /models/flint-FP8-BF16
      - '--speculative-config={"method": "dflash", "model": "/models/Flint-DFlash2", "num_speculative_tokens": ${SPEC_TOKENS:-3}}'
      - --attention-backend=TRITON_ATTN
      - --kv-cache-dtype=int8_per_token_head
      - --gpu-memory-utilization=${GPU_UTIL:-0.85}
      - --max-model-len=${MAX_MODEL_LEN:-131072}
      - --max-num-batched-tokens=${MAX_BATCHED_TOKENS:-8192}
      - --max-num-seqs=${MAX_NUM_SEQS:-16}
