# LFM2.5-24B-A2B FP8 (block-scaled), text only. Context caps at 131,072.
#
#   docker compose -f lfm2.5-24b-a2b-fp8.yaml up -d
#
# Overrides go in .env (see .env.example) or the shell.
services:
  lfm2.5-24b-a2b-fp8:
    extends:
      file: common.yaml
      service: strix
    environment:
      MTP: ${MTP:-0}
      HF_REPO: LiquidAI/LFM2.5-24B-A2B-FP8
    command:
      - /models/LFM2.5-24B-A2B-FP8
      - --attention-backend=TRITON_ATTN
      - --kv-cache-dtype=int8_per_token_head
      - --gpu-memory-utilization=${GPU_UTIL:-0.85}
      - --max-model-len=${MAX_MODEL_LEN:-131072}
      - --max-num-batched-tokens=${MAX_BATCHED_TOKENS:-8192}
      - --max-num-seqs=${MAX_NUM_SEQS:-16}
      # Tool calls and reasoning come back parsed, as chat clients expect.
      - --enable-auto-tool-choice
      - --tool-call-parser=lfm2
      - --reasoning-parser=deepseek_r1
      # Sampling defaults (LFM2.5 generation_config.json); a request's own values win.
      - '--override-generation-config={"temperature": 0.1, "top_k": 50, "repetition_penalty": 1.05}'
