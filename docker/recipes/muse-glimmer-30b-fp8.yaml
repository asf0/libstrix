# Muse-Glimmer-30B FP8 (block-scaled). Context caps at 131,072.
#
#   docker compose -f muse-glimmer-30b-fp8.yaml up -d
#
# Overrides go in .env (see .env.example) or the shell.
services:
  muse-glimmer-30b-fp8:
    extends:
      file: common.yaml
      service: strix
    environment:
      MTP: ${MTP:-0}
      HF_REPO: RedHatAI/Muse-Glimmer-30B-FP8-block
    command:
      - /models/Muse-Glimmer-30B-FP8-block
      - --mm-encoder-attn-backend=TRITON_ATTN
      - --attention-backend=TRITON_ATTN
      - --kv-cache-dtype=int8_per_token_head
      - --gpu-memory-utilization=${GPU_UTIL:-0.85}
      - --max-model-len=${MAX_MODEL_LEN:-131072}
      - --max-num-batched-tokens=${MAX_BATCHED_TOKENS:-8192}
      - --max-num-seqs=${MAX_NUM_SEQS:-16}
      # As the model card serves it: reasoning and tool calls come back parsed
      # instead of as raw `to=self` / `to=user` channel text.
      - --reasoning-parser=muse_glimmer
      - --tool-call-parser=muse_glimmer
      - --enable-auto-tool-choice
