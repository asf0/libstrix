# Flint FP8 (FP8 routed experts, bf16 elsewhere; HawkBearPig/flint-FP8-BF16).
# Text only. Tool calls and reasoning use the GLM parsers (glm45): Flint writes
# <tool_call> and <think> in that layout.
#
#   docker compose -f flint-fp8.yaml up -d
#
# Overrides go in .env (see .env.example) or the shell.
services:
  flint-fp8:
    extends:
      file: common.yaml
      service: strix
    environment:
      HF_REPO: HawkBearPig/flint-FP8-BF16
    command:
      - /models/flint-FP8-BF16
      - --attention-backend=TRITON_ATTN
      - --kv-cache-dtype=int8_per_token_head
      - --gpu-memory-utilization=${GPU_UTIL:-0.85}
      - --max-model-len=${MAX_MODEL_LEN:-262144}
      - --max-num-batched-tokens=${MAX_BATCHED_TOKENS:-8192}
      - --max-num-seqs=${MAX_NUM_SEQS:-8}
      # Tool calls and reasoning come back parsed, as chat clients expect.
      - --enable-auto-tool-choice
      - --tool-call-parser=glm45
      - --reasoning-parser=glm45
      # Sampling defaults (its generation_config.json); a request's own values win.
      - '--override-generation-config={"temperature": 1.0, "top_p": 0.95, "top_k": 20}'
