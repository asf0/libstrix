# MiniCPM-V-4.7-35B-A3B FP8 (per-channel). The checkpoint has no MTP weights.
#
#   docker compose -f minicpm-v-4.7-35b-a3b-fp8.yaml up -d
#
# Overrides go in .env (see .env.example) or the shell.
services:
  minicpm-v-4.7-35b-a3b-fp8:
    extends:
      file: common.yaml
      service: strix
    environment:
      MTP: ${MTP:-0}
      HF_REPO: openbmb/MiniCPM-V-4.7-35B-A3B-FP8
    command:
      - /models/MiniCPM-V-4.7-35B-A3B-FP8
      - --mm-encoder-attn-backend=TRITON_ATTN
      - --attention-backend=TRITON_ATTN
      - --kv-cache-dtype=int8_per_token_head
      - --gpu-memory-utilization=${GPU_UTIL:-0.85}
      - --max-model-len=${MAX_MODEL_LEN:-131072}
      - --max-num-batched-tokens=${MAX_BATCHED_TOKENS:-8192}
      - --max-num-seqs=${MAX_NUM_SEQS:-16}
      # Tool calls and reasoning come back parsed, as chat clients expect.
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=minicpmv
      # The template turns thinking off unless asked; with it off the answer
      # carries no </think> and the reasoning parser files all of it as reasoning.
      - '--default-chat-template-kwargs={"enable_thinking": true}'
