# MiniCPM-V-4.7-35B-A3B FP8 (per-channel) + speculative decoding with the
# DSpark draft (openbmb/MiniCPM-V-4.7-35B-A3B-DSpark, mounted next to the
# target under /models). The checkpoint ships no MTP weights of its own.
# SPEC_TOKENS sets the draft tokens per step (at most 15: the draft's block
# size); 4 is the default until spec_equiv picks the measured best.
#
#   docker compose -f minicpm-v-4.7-35b-a3b-fp8.yaml up -d
#
# Overrides go in .env (see .env.example) or the shell.
services:
  minicpm-v-4.7-35b-a3b-fp8:
    extends:
      file: common.yaml
      service: strix
    environment:
      MTP: 0
      HF_REPO: openbmb/MiniCPM-V-4.7-35B-A3B-FP8
    command:
      - /models/MiniCPM-V-4.7-35B-A3B-FP8
      - '--speculative-config={"method": "dspark", "model": "/models/MiniCPM-V-4.7-35B-A3B-DSpark", "num_speculative_tokens": ${SPEC_TOKENS:-4}}'
      - --mm-encoder-attn-backend=TRITON_ATTN
      - --attention-backend=TRITON_ATTN
      - --kv-cache-dtype=int8_per_token_head
      - --gpu-memory-utilization=${GPU_UTIL:-0.85}
      - --max-model-len=${MAX_MODEL_LEN:-262144}
      - --max-num-batched-tokens=${MAX_BATCHED_TOKENS:-8192}
      - --max-num-seqs=${MAX_NUM_SEQS:-8}
      # Tool calls and reasoning come back parsed, as chat clients expect.
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=minicpmv
      # The template turns thinking off unless asked; with it off the answer
      # carries no </think> and the reasoning parser files all of it as reasoning.
      - '--default-chat-template-kwargs={"enable_thinking": true}'
      # Sampling defaults (its generation_config.json); a request's own values win.
      - '--override-generation-config={"temperature": 1.0, "top_p": 0.95, "top_k": 20}'
