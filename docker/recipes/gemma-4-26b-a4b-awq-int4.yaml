# gemma-4-26B-A4B AWQ 4-bit + speculative decoding with the DFlash draft
# (z-lab/gemma-4-26B-A4B-it-DFlash, mounted under /models). SPEC_TOKENS sets
# the draft tokens per step (the draft's block size of 16 minus one at most).
#
#   docker compose -f gemma-4-26b-a4b-awq-int4.yaml up -d
#
# Overrides go in .env (see .env.example) or the shell.
services:
  gemma-4-26b-a4b-awq-int4:
    extends:
      file: common.yaml
      service: strix
    environment:
      MTP: 0
      HF_REPO: cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit
    command:
      - /models/gemma-4-26B-A4B-it-AWQ-4bit
      - '--speculative-config={"method": "dflash", "model": "/models/gemma-4-26B-A4B-it-DFlash", "num_speculative_tokens": ${SPEC_TOKENS:-15}}'
      - --mm-encoder-attn-backend=TRITON_ATTN
      - --attention-backend=TRITON_ATTN
      - --kv-cache-dtype=int8_per_token_head
      - --gpu-memory-utilization=${GPU_UTIL:-0.85}
      - --max-model-len=${MAX_MODEL_LEN:-262144}
      - --max-num-batched-tokens=${MAX_BATCHED_TOKENS:-8192}
      - --max-num-seqs=${MAX_NUM_SEQS:-8}
      # Tool calls and reasoning come back parsed, as chat clients expect.
      - --enable-auto-tool-choice
      - --tool-call-parser=gemma4
      - --reasoning-parser=gemma4
      # Sampling defaults (gemma-4 generation_config.json); a request's own values win.
      - '--override-generation-config={"temperature": 1.0, "top_p": 0.95, "top_k": 64}'
